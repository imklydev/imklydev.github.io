<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/github-contributions-calendar-graph.css" />
    <link rel="stylesheet" href="css/project-showcase.css" />
    <link rel="stylesheet" href="css/hero-section.css" />
    <link rel="stylesheet" href="css/navbar.css" />

    <title>klydev</title>
  </head>

  <body>
    <nav class="navbar">
      <div class="container">
        <span><a href="/">klydev</a></span>
        <div class="links">
          <a href="https://github.com/imklydev" target="_blank">
            <img
              src="https://github.githubassets.com/favicons/favicon-dark.svg"
              alt="Github"
            />
          </a>
        </div>
      </div>
    </nav>

    <section class="hero">
      <div class="github-contributions-section">
        <div
          class="github-contributions-calendar-graph"
          id="github-contributions-calendar-graph"
        ></div>
      </div>
    </section>

    <section class="project-showcases-section">
      <a href="https://github.com/imklydev/Myra" target="_blank">
        <div class="project-showcase">
          <div>
            <h1>Myra</h1>
            <p>A performant, highly customizable, and unique code editor</p>
          </div>
          <div class="languages-used">
            <span
              class="circle-thingy"
              style="background-color: rgb(165, 48, 42)"
            ></span>
            <span>C++</span>
          </div>
        </div>
      </a>
      <a href="https://github.com/imklydev/klydev.com" target="_blank">
        <div class="project-showcase">
          <div>
            <h1>klydev.com</h1>
            <p>
              Source code for the (soon to be) klydev.com website, a simple site
              written with no UI framework
            </p>
          </div>
          <div class="languages-used">
            <span
              class="circle-thingy"
              style="background-color: rgb(165, 69, 42)"
            ></span>
            <span>HTML</span>
            <span
              class="circle-thingy"
              style="background-color: rgb(42, 140, 165)"
            ></span>
            <span>CSS</span>
            <span
              class="circle-thingy"
              style="background-color: rgb(203, 186, 31)"
            ></span>
            <span>JS</span>
          </div>
        </div>
      </a>
    </section>

    <script
      type="module"
      src="js/github-contributions-calendar-graph.js"
    ></script>
  </body>
</html>
